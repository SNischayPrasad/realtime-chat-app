name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Type errors and build failures should surface on the push that caused
      # them, not on the next deploy attempt.
      - run: npm run typecheck

      # The encryption primitives are the one place where a silent regression
      # is unrecoverable rather than merely annoying.
      - run: npm run test:crypto

      - run: npm run build
