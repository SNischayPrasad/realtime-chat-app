# Two containers: the workspace the app runs in, and a real Postgres beside it.
# The chat app needs a shared datastore for message history AND for cross-user
# delivery, so a throwaway Postgres is part of the dev environment rather than
# something you have to sign up for.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/realtime-chat-app:cached
    environment:
      # sslmode=disable matters: the container talks to `db` over the compose
      # network, and the pg pool would otherwise try TLS against a plain server.
      DATABASE_URL: postgres://chat:chat@db:5432/chat?sslmode=disable
      AUTH_SECRET: codespace-development-secret-not-for-production
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
